<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Cyber Shield</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
  <form method="POST" action="login.php" class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold text-blue-600 mb-4 text-center">Login</h2>
    <label>Email</label>
    <input type="email" name="email" required class="w-full p-2 border rounded mb-4">
    <label>Password</label>
    <input type="password" name="password" required class="w-full p-2 border rounded mb-4">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700">Login</button>
  </form>
</body>
