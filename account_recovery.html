<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery | Cyber Shield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom animations and enhancements */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    /* Mobile optimizations */
    @media (max-width: 768px) {
      .hover\:scale-105:hover {
        transform: scale(1.02);
      }
      .hover\:-translate-y-1:hover {
        transform: translateY(-2px);
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">
  <!-- Header Navigation -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold text-blue-600">
        Cyber Shield: Account Recovery
      </h1>
      <nav class="flex items-center gap-4 text-sm">
        <a href="index.html" class="text-blue-600 hover:text-blue-800 transition font-medium">← Back to Home</a>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">🔐 Account Recovery Assistant</h2>
        <p class="text-lg text-gray-600">Comprehensive guide to recover any type of account safely and efficiently</p>
      </div>
    
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" for="accountType">Select Account Type:</label>
          <select id="accountType" onchange="showAccountInfo()" 
                  class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="">--Choose Account Type--</option>
        <optgroup label="📧 Email & Communication">
          <option value="email-gmail">Gmail</option>
          <option value="email-outlook">Outlook/Hotmail</option>
          <option value="email-yahoo">Yahoo Mail</option>
          <option value="email-other">Other Email Providers</option>
        </optgroup>
        <optgroup label="📱 Social Media">
          <option value="social-facebook">Facebook</option>
          <option value="social-instagram">Instagram</option>
          <option value="social-twitter">Twitter/X</option>
          <option value="social-linkedin">LinkedIn</option>
          <option value="social-tiktok">TikTok</option>
          <option value="social-snapchat">Snapchat</option>
          <option value="social-discord">Discord</option>
          <option value="social-telegram">Telegram</option>
          <option value="social-whatsapp">WhatsApp</option>
        </optgroup>
        <optgroup label="💰 Financial Services">
          <option value="bank-traditional">Traditional Bank Account</option>
          <option value="bank-online">Online Banking</option>
          <option value="bank-paypal">PayPal</option>
          <option value="bank-crypto">Cryptocurrency Exchange</option>
          <option value="bank-credit">Credit Card Account</option>
          <option value="bank-investment">Investment/Trading Account</option>
        </optgroup>
        <optgroup label="🎮 Gaming & Entertainment">
          <option value="gaming-steam">Steam</option>
          <option value="gaming-xbox">Xbox Live</option>
          <option value="gaming-playstation">PlayStation Network</option>
          <option value="gaming-nintendo">Nintendo Account</option>
          <option value="gaming-epic">Epic Games</option>
          <option value="gaming-blizzard">Battle.net</option>
          <option value="gaming-mobile">Mobile Games</option>
        </optgroup>
        <optgroup label="💼 Professional & Work">
          <option value="work-microsoft">Microsoft 365</option>
          <option value="work-google">Google Workspace</option>
          <option value="work-slack">Slack</option>
          <option value="work-zoom">Zoom</option>
          <option value="work-corporate">Corporate Account</option>
        </optgroup>
        <optgroup label="🛒 E-commerce & Shopping">
          <option value="shop-amazon">Amazon</option>
          <option value="shop-ebay">eBay</option>
          <option value="shop-etsy">Etsy</option>
          <option value="shop-shopify">Shopify Store</option>
          <option value="shop-other">Other Shopping Sites</option>
        </optgroup>
        <optgroup label="☁️ Cloud & Storage">
          <option value="cloud-icloud">iCloud</option>
          <option value="cloud-gdrive">Google Drive</option>
          <option value="cloud-dropbox">Dropbox</option>
          <option value="cloud-onedrive">OneDrive</option>
        </optgroup>
        <optgroup label="📺 Streaming & Media">
          <option value="media-netflix">Netflix</option>
          <option value="media-spotify">Spotify</option>
          <option value="media-youtube">YouTube</option>
          <option value="media-twitch">Twitch</option>
          <option value="media-disney">Disney+</option>
        </optgroup>
        <optgroup label="🔧 Others">
          <option value="other-apple">Apple ID</option>
          <option value="other-government">Government Services</option>
          <option value="other-education">Educational Platform</option>
          <option value="other-health">Healthcare Portal</option>
          <option value="other-custom">Custom/Other Service</option>
        </optgroup>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" for="issueType">What's the specific issue?</label>
          <select id="issueType" 
                  class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="">--Select Issue--</option>
        <option value="forgot-password">Forgot Password</option>
        <option value="forgot-username">Forgot Username/Email</option>
        <option value="locked-account">Account Locked/Suspended</option>
        <option value="hacked-account">Account Hacked/Compromised</option>
        <option value="2fa-lost">Lost 2FA Device/Codes</option>
        <option value="phone-changed">Phone Number Changed</option>
        <option value="email-changed">Email Address Changed</option>
        <option value="deceased-account">Deceased Person's Account</option>
        <option value="underage-account">Underage Account Issues</option>
        <option value="business-account">Business Account Problems</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" for="urgencyLevel">How urgent is this?</label>
          <select id="urgencyLevel" 
                  class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="low">Low - Can wait a few days</option>
            <option value="medium">Medium - Need access within 24 hours</option>
            <option value="high">High - Urgent, security concern</option>
            <option value="emergency">Emergency - Active security threat</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" for="additionalInfo">Additional Information (Optional):</label>
          <textarea id="additionalInfo" rows="3" 
                    placeholder="Describe any additional details about your situation..."
                    class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"></textarea>
        </div>

        <button onclick="generateRecoverySteps()" 
                class="w-full bg-blue-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-blue-700 transition duration-200 transform hover:scale-105">
          🔍 Generate Recovery Plan
        </button>
      </div>

      <div id="recoveryOutput" class="hidden mt-8"></div>
    </div>
  </div>

  <script>
    const recoveryData = {
      // Email Accounts
      'email-gmail': {
        title: 'Gmail Account Recovery',
        urgency: 'medium',
        steps: [
          'Go to https://accounts.google.com/signin/recovery',
          'Enter your Gmail address and click "Forgot password?"',
          'Try your last remembered password',
          'Use recovery phone number if available',
          'Use recovery email if configured',
          'Answer security questions if prompted',
          'Use backup codes if you have them saved',
          'Contact Google Support if other methods fail'
        ],
        links: {
          'Gmail Recovery': 'https://accounts.google.com/signin/recovery',
          'Google Support': 'https://support.google.com/mail',
          'Account Security': 'https://myaccount.google.com/security'
        },
        warnings: ['Never share your recovery codes with anyone', 'Enable 2FA after recovery']
      },
      'email-outlook': {
        title: 'Outlook/Hotmail Account Recovery',
        urgency: 'medium',
        steps: [
          'Visit https://account.live.com/password/reset',
          'Enter your email address',
          'Choose recovery method (email, phone, or security questions)',
          'Check your alternate email or phone for verification code',
          'Create a new strong password',
          'Update security information',
          'Enable two-factor authentication'
        ],
        links: {
          'Microsoft Account Recovery': 'https://account.live.com/password/reset',
          'Account Security': 'https://account.microsoft.com/security',
          'Support': 'https://support.microsoft.com/'
        }
      },
      'email-yahoo': {
        title: 'Yahoo Mail Account Recovery',
        urgency: 'medium',
        steps: [
          'Go to https://login.yahoo.com/forgot-password',
          'Enter your Yahoo email or phone number',
          'Select recovery method (text, call, or alternate email)',
          'Enter verification code received',
          'Create new password',
          'Update security settings',
          'Set up account key for future security'
        ],
        links: {
          'Yahoo Account Recovery': 'https://login.yahoo.com/forgot-password',
          'Yahoo Help': 'https://help.yahoo.com/'
        }
      },
      // Social Media
      'social-facebook': {
        title: 'Facebook Account Recovery',
        urgency: 'high',
        steps: [
          'Visit https://www.facebook.com/login/identify',
          'Enter email, phone, or username',
          'Select recovery method from available options',
          'Use trusted contacts if configured',
          'Submit government ID if required',
          'Check for any suspicious activity',
          'Update password and enable 2FA',
          'Review recent login activity'
        ],
        links: {
          'Facebook Recovery': 'https://www.facebook.com/login/identify',
          'Hacked Account': 'https://www.facebook.com/hacked',
          'ID Upload': 'https://www.facebook.com/help/contact/183000765122339'
        },
        warnings: ['Facebook may require government ID verification', 'Check for unauthorized posts or messages']
      },
      'social-instagram': {
        title: 'Instagram Account Recovery',
        urgency: 'high',
        steps: [
          'Go to Instagram login page and tap "Get help signing in"',
          'Enter username or email',
          'Choose "Send an email" or "Send an SMS"',
          'Check email/phone for recovery link',
          'If hacked, report through Instagram\'s hacked form',
          'Change password immediately',
          'Enable two-factor authentication',
          'Review follower and following lists'
        ],
        links: {
          'Instagram Help': 'https://help.instagram.com/',
          'Hacked Account': 'https://www.instagram.com/hacked/',
          'Support': 'https://help.instagram.com/contact/'
        }
      },
      // Banking
      'bank-traditional': {
        title: 'Traditional Bank Account Recovery',
        urgency: 'emergency',
        steps: [
          'Contact bank customer service immediately',
          'Visit nearest branch with valid ID',
          'Explain the situation to bank representative',
          'Provide identity verification documents',
          'Reset online banking credentials',
          'Update contact information',
          'Set up new security questions',
          'Monitor account for unauthorized transactions'
        ],
        links: {
          'FDIC Bank Find': 'https://banks.data.fdic.gov/bankfind-suite/',
          'Consumer Financial Protection': 'https://www.consumerfinance.gov/'
        },
        warnings: ['Never share banking credentials over phone/email', 'Monitor account statements closely', 'Report unauthorized transactions immediately']
      },
      'bank-paypal': {
        title: 'PayPal Account Recovery',
        urgency: 'high',
        steps: [
          'Go to https://www.paypal.com/signin and click "Having trouble logging in?"',
          'Enter email address or phone number',
          'Follow email or SMS instructions',
          'Answer security questions if prompted',
          'Call PayPal customer service if needed',
          'Change password immediately',
          'Enable two-factor authentication',
          'Review recent transactions'
        ],
        links: {
          'PayPal Help': 'https://www.paypal.com/us/help/',
          'Resolution Center': 'https://www.paypal.com/us/disputes/',
          'Contact PayPal': 'https://www.paypal.com/us/help/contact-us'
        }
      },
      // Gaming
      'gaming-steam': {
        title: 'Steam Account Recovery',
        urgency: 'medium',
        steps: [
          'Visit https://help.steampowered.com/',
          'Click "I can\'t sign in to my Steam account"',
          'Enter Steam account name or email',
          'Choose recovery method',
          'Check email for recovery instructions',
          'Provide proof of account ownership if requested',
          'Contact Steam Support with purchase history',
          'Enable Steam Guard after recovery'
        ],
        links: {
          'Steam Support': 'https://help.steampowered.com/',
          'Account Recovery': 'https://help.steampowered.com/en/wizard/HelpWithLogin'
        }
      },
      // Cloud Storage
      'cloud-icloud': {
        title: 'iCloud Account Recovery',
        urgency: 'high',
        steps: [
          'Go to https://iforgot.apple.com/',
          'Enter your Apple ID',
          'Choose to reset password or unlock account',
          'Use two-factor authentication if enabled',
          'Answer security questions',
          'Use account recovery if other methods fail',
          'Contact Apple Support if needed',
          'Update all devices with new password'
        ],
        links: {
          'Apple ID Recovery': 'https://iforgot.apple.com/',
          'Apple Support': 'https://support.apple.com/',
          'Account Recovery': 'https://support.apple.com/en-us/HT201487'
        }
      },
      // Default for others
      'other-custom': {
        title: 'General Account Recovery',
        urgency: 'medium',
        steps: [
          'Visit the official website of the service',
          'Look for "Forgot Password" or "Account Recovery" links',
          'Try common recovery methods (email, phone, security questions)',
          'Search for "[Service Name] account recovery" online',
          'Contact customer support with proof of ownership',
          'Check your email for old registration confirmations',
          'Try remembering variations of passwords you\'ve used',
          'Consider if account was linked to social media login'
        ],
        links: {
          'General Tips': '#',
          'Security Best Practices': '#'
        }
      }
    };

    const issueSpecificSteps = {
      'hacked-account': [
        '🚨 URGENT: Change passwords on all other accounts immediately',
        'Run antivirus scan on all devices',
        'Check bank and credit card statements',
        'Enable 2FA on all recovered accounts',
        'Notify contacts about potential spam from your account'
      ],
      'locked-account': [
        'Wait for any temporary lockout period to expire',
        'Check email for account lockout notifications',
        'Ensure you\'re using correct login credentials',
        'Clear browser cache and cookies',
        'Try logging in from a different device/network'
      ],
      '2fa-lost': [
        'Use backup codes if you saved them',
        'Contact support with account verification',
        'Use alternate 2FA methods if available',
        'Access account from previously trusted device',
        'Prepare identity verification documents'
      ]
    };

    function showAccountInfo() {
      // This function can be expanded to show specific info about selected account type
    }

    function generateRecoverySteps() {
      const accountType = document.getElementById('accountType').value;
      const issueType = document.getElementById('issueType').value;
      const urgencyLevel = document.getElementById('urgencyLevel').value;
      const additionalInfo = document.getElementById('additionalInfo').value;
      const output = document.getElementById('recoveryOutput');

      if (!accountType || !issueType) {
        output.innerHTML = `<div class="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded-xl">⚠️ Please select both account type and issue type.</div>`;
        output.classList.remove('hidden');
        return;
      }

      const accountData = recoveryData[accountType] || recoveryData['other-custom'];
      const urgencyClass = urgencyLevel === 'emergency' ? 'bg-red-50 border-l-4 border-red-500' : 
                          urgencyLevel === 'high' ? 'bg-yellow-50 border-l-4 border-yellow-500' : 
                          'bg-blue-50 border-l-4 border-blue-500';
      
      let html = `<div class="${urgencyClass} rounded-xl p-6 fade-in">`;
      
      // Title and urgency
      const urgencyBadgeClass = urgencyLevel === 'emergency' ? 'bg-red-600 text-white pulse-animation' :
                               urgencyLevel === 'high' ? 'bg-red-500 text-white' :
                               urgencyLevel === 'medium' ? 'bg-yellow-500 text-white' :
                               'bg-green-500 text-white';
      
      html += `<div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4">`;
      html += `<h3 class="text-2xl font-bold text-gray-800 mb-2 md:mb-0">${accountData.title}</h3>`;
      html += `<span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${urgencyBadgeClass}">${urgencyLevel.toUpperCase()} PRIORITY</span>`;
      html += `</div>`;
      
      // Emergency warning if applicable
      if (urgencyLevel === 'emergency' || issueType === 'hacked-account') {
        html += `<div class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg mb-4"><strong>🚨 SECURITY ALERT:</strong> Take immediate action to secure your account and personal information!</div>`;
      }
      
      // Main recovery steps
      html += `<div class="mb-6">`;
      html += `<h4 class="text-lg font-semibold text-gray-800 mb-4 flex items-center"><span class="text-blue-600 mr-2">🔧</span>Recovery Steps:</h4>`;
      html += `<div class="space-y-3">`;
      accountData.steps.forEach((step, index) => {
        html += `<div class="flex items-start p-3 bg-white rounded-lg border border-gray-200 hover:shadow-md transition">`;
        html += `<span class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center text-sm font-semibold mr-3">${index + 1}</span>`;
        html += `<span class="text-gray-700">${step}</span>`;
        html += `</div>`;
      });
      html += `</div></div>`;
      
      // Issue-specific additional steps
      if (issueSpecificSteps[issueType]) {
        html += `<div class="mb-6">`;
        html += `<h4 class="text-lg font-semibold text-gray-800 mb-4 flex items-center"><span class="text-yellow-600 mr-2">⚠️</span>Additional Steps for ${issueType.replace('-', ' ').toUpperCase()}:</h4>`;
        html += `<div class="space-y-3">`;
        issueSpecificSteps[issueType].forEach((step, index) => {
          html += `<div class="flex items-start p-3 bg-yellow-50 rounded-lg border border-yellow-200">`;
          html += `<span class="flex-shrink-0 w-8 h-8 bg-yellow-600 text-white rounded-full flex items-center justify-center text-sm font-semibold mr-3">+</span>`;
          html += `<span class="text-gray-700">${step}</span>`;
          html += `</div>`;
        });
        html += `</div></div>`;
      }
      
      // Helpful links
      if (accountData.links) {
        html += `<div class="bg-gray-50 rounded-lg p-4 mb-6">`;
        html += `<h4 class="text-lg font-semibold text-gray-800 mb-3 flex items-center"><span class="text-blue-600 mr-2">🔗</span>Helpful Links:</h4>`;
        html += `<div class="space-y-2">`;
        for (const [name, url] of Object.entries(accountData.links)) {
          html += `<a href="${url}" target="_blank" class="block text-blue-600 hover:text-blue-800 hover:underline transition font-medium">${name}</a>`;
        }
        html += `</div></div>`;
      }
      
      // Warnings
      if (accountData.warnings) {
        html += `<div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">`;
        html += `<h4 class="text-lg font-semibold text-red-800 mb-3 flex items-center"><span class="mr-2">⚠️</span>Important Warnings:</h4>`;
        html += `<ul class="space-y-2 text-red-700">`;
        accountData.warnings.forEach(warning => {
          html += `<li class="flex items-start"><span class="text-red-500 mr-2">•</span>${warning}</li>`;
        });
        html += `</ul></div>`;
      }
      
      // Prevention tips
      html += `<div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">`;
      html += `<h4 class="text-lg font-semibold text-green-800 mb-3 flex items-center"><span class="mr-2">🛡️</span>Prevention Tips for the Future:</h4>`;
      html += `<ul class="space-y-2 text-green-700">`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Enable two-factor authentication (2FA) on all accounts</li>`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Use a password manager to generate and store unique passwords</li>`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Keep recovery information updated and easily accessible</li>`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Regularly backup important account data</li>`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Monitor accounts for suspicious activity</li>`;
      html += `<li class="flex items-start"><span class="text-green-500 mr-2">•</span>Use trusted devices and networks when possible</li>`;
      html += `</ul></div>`;
      
      // Additional user info if provided
      if (additionalInfo.trim()) {
        html += `<div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">`;
        html += `<h4 class="text-lg font-semibold text-blue-800 mb-3 flex items-center"><span class="mr-2">📝</span>Your Additional Information:</h4>`;
        html += `<p class="text-blue-700">${additionalInfo}</p>`;
        html += `</div>`;
      }
      
      html += `</div>`;
      
      output.innerHTML = html;
      output.classList.remove('hidden');
      
      // Scroll to results
      output.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    // Add some dynamic functionality
    document.addEventListener('DOMContentLoaded', function() {
      const urgencySelect = document.getElementById('urgencyLevel');
      const issueSelect = document.getElementById('issueType');
      
      // Auto-set urgency for certain issues
      issueSelect.addEventListener('change', function() {
        if (this.value === 'hacked-account') {
          urgencySelect.value = 'emergency';
        } else if (this.value === 'locked-account' || this.value === '2fa-lost') {
          urgencySelect.value = 'high';
        }
      });
    });
    
    // Add mobile-friendly touch handling
    if ('ontouchstart' in window) {
      document.addEventListener('touchstart', function() {}, true);
    }
  </script>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 text-center mt-12">
    <div class="max-w-4xl mx-auto px-4">
      <p class="text-sm">&copy; 2025 Cyber Shield: Security Awareness and Rescue System. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
